name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto Init & Build APK
      run: |
        # Eksik Gradle wrapper ve dizin yapısını anlık oluşturur
        gradle init --type basic --script-style kotlin || true
        gradle assembleDebug --stacktrace || gradle build --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SamsungFlashTool-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
          **/*.apk
